---
# Tareas que cPanel ejecuta al desplegar (Git Version Control -> Deploy HEAD Commit,
# o vía UAPI desde el MCP). Se corren como el usuario de cPanel, con el repo como cwd.
#
# Ajustar si hace falta:
#   APP  -> dónde vive la aplicación (fuera del document root)
#   WEB  -> document root del dominio
#   PHP  -> binario de PHP CLI. Alternativa típica:
#           /opt/cpanel/ea-php83/root/usr/bin/php
deployment:
  tasks:
    - export APP="$HOME/weblab"
    - export WEB="$HOME/webapp.cefppj.org.mx"

    # 0. Binario de PHP para la CLI.
    #
    #    No usar /usr/local/bin/php: es el PHP del selector de CloudLinux, que
    #    gobierna la línea de comandos y puede ir por detrás del que sirve el
    #    sitio. En este servidor la web corre 8.3.33 mientras la CLI seguía en
    #    7.0.33, y artisan moría con "Composer detected issues in your platform".
    #    Se elige el primer binario que sea realmente 8.3 o superior.
    - export PHP=$(for p in /opt/cpanel/ea-php83/root/usr/bin/php /opt/alt/php83/usr/bin/php /opt/cpanel/ea-php84/root/usr/bin/php /opt/alt/php84/usr/bin/php /usr/local/bin/php; do [ -x "$p" ] && "$p" -r 'if (PHP_VERSION_ID < 80300) exit(1);' 2>/dev/null && { echo "$p"; break; }; done)
    - test -n "$PHP" || { echo "ERROR - no se encontro un PHP 8.3+ en el servidor"; exit 1; }
    - echo "PHP CLI -> $PHP ($($PHP -r 'echo PHP_VERSION;'))"

    # 1. Código de la aplicación (sin .env, sin storage: esos viven en el servidor)
    - /bin/mkdir -p "$APP" "$WEB"
    - /usr/bin/rsync -a --delete --exclude=.git --exclude=.env --exclude=/storage --exclude=/public --exclude=/node_modules ./ "$APP/"

    # 2. Directorios de escritura que git no versiona
    - /bin/mkdir -p "$APP/storage/framework/cache/data" "$APP/storage/framework/sessions" "$APP/storage/framework/views" "$APP/storage/logs" "$APP/storage/app/public" "$APP/bootstrap/cache"
    - /bin/chmod -R 775 "$APP/storage" "$APP/bootstrap/cache"

    # 3. Assets públicos. Se borra build/ para no acumular bundles viejos de Vite,
    #    y el index.html de relleno del subdominio, que Apache sirve antes que
    #    index.php y dejaría la app invisible.
    - /bin/rm -rf "$WEB/build"
    - /bin/rm -f "$WEB/index.html"
    - /usr/bin/rsync -a --exclude=index.php ./public/ "$WEB/"
    - /bin/cp ./deploy/cpanel-index.php "$WEB/index.php"
    - /bin/ln -sfn "$APP/storage/app/public" "$WEB/storage"

    # 4. Base de datos y cachés
    - $PHP "$APP/artisan" migrate --force
    - $PHP "$APP/artisan" optimize:clear
    - $PHP "$APP/artisan" optimize
    - echo "Deploy terminado: $(git log -1 --pretty='%h %s')"
