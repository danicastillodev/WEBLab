services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laboratorio_app
    working_dir: /var/www
    environment:
      DB_HOST: db
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: laboratorio_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: mariadb:11
    container_name: laboratorio_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laboratorio
      MYSQL_USER: laboratorio
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  node:
    image: node:20-alpine
    container_name: laboratorio_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
